name: Build Android APK

on:
  push:
    branches: [main, master]
    paths: ["android/**", "ci/android-gradle/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      # Tanda tangan APK. Tanpa secrets -> keystore baru tiap build (APK baru harus
      # install ulang / uninstall dulu). Isi 3 secrets (lihat README) supaya bisa update-in-place.
      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass android -keypass android -alias sockshare \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StarDevNett"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_ALIAS=sockshare" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p ci/android-gradle assembleRelease --no-daemon

      - name: Rapikan nama file
        run: |
          mkdir -p out
          cp ci/android-gradle/app/build/outputs/apk/release/app-release.apk out/StarDevNett-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarDevNett-Android
          path: out/StarDevNett-Android.apk

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/StarDevNett-Android.apk
