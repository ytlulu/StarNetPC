apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.yt.sockshare"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 5
        versionName "1.4"
    }

    // Pakai langsung struktur proyek AIDE di ../../android
    sourceSets {
        main {
            manifest.srcFile '../../../android/AndroidManifest.xml'
            java.srcDirs = ['../../../android/src']
            res.srcDirs = ['../../../android/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KS_FILE") ?: "release.keystore")
            storePassword System.getenv("KS_PASS") ?: "android"
            keyAlias System.getenv("KS_ALIAS") ?: "starnett"
            keyPassword System.getenv("KS_KEY_PASS") ?: (System.getenv("KS_PASS") ?: "android")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
